name: Veytrix CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/restore-pa-smc-engine]

permissions:
  contents: write

concurrency:
  group: veytrix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile from declared workspace dependencies
        run: pnpm install --lockfile-only

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check workspace
        run: pnpm run typecheck

      - name: Build workspace
        run: pnpm run build

      - name: Commit lockfile repair
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: sync pnpm lockfile"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
