name: Veytrix CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/restore-pa-smc-engine]

permissions:
  contents: read

concurrency:
  group: veytrix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile from declared workspace dependencies
        run: pnpm install --lockfile-only

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace package
        run: pnpm --filter @veytrix/shared build

      - name: Test Finnhub calendar timestamp normalization
        run: pnpm --filter @veytrix/api test

      - name: Type-check workspace
        run: pnpm run typecheck

      - name: Build workspace
        run: pnpm run build
